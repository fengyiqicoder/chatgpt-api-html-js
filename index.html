<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI in plain HTML and JavaScript</title>
  <style>
    body { max-width: 680px; margin: 56px auto; padding: 0 20px; font: 18px/1.6 system-ui, sans-serif; color: #1b1f24; }
    textarea { width: 100%; height: 96px; padding: 12px; font: inherit; border: 1px solid #c9ced6; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 9px 22px; font: inherit; color: #fff; background: #0969da; border: 0; border-radius: 8px; cursor: pointer; }
    #answer { margin-top: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Ask the AI</h1>
  <textarea id="prompt" placeholder="Ask anything..."></textarea>
  <button id="send">Send</button>
  <div id="answer"></div>

  <script src="https://onetagai.com/v1.js" data-key="ot_demo000000000000000000000"></script>
  <script type="module">
    const history = [];

    document.querySelector("#send").onclick = async () => {
      const prompt = document.querySelector("#prompt").value;
      const answer = document.querySelector("#answer");
      answer.textContent = "";

      const text = await onetag.ask(prompt, null, {
        system: "You are a helpful assistant. Reply in plain text, no Markdown.",
        history,
        stream: (delta) => (answer.textContent += delta),
      });

      history.push({ role: "user", content: prompt }, { role: "assistant", content: text });
    };
  </script>
</body>
</html>
